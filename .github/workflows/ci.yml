name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The workspace's tests, split by crate into jobs that run side by side, each within its
  # own time limit. Together they run every crate's tests, doc-tests included, as
  # `cargo test --workspace --all-features` did. The service and the harness need
  # PostgreSQL; with `PUBKY_SWITCH_REQUIRE_DB` set a missing database fails their tests
  # rather than skipping them. The others use none.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: switch
          POSTGRES_PASSWORD: switch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PUBKY_SWITCH_TEST_DATABASE_URL: postgres://switch:switch@localhost:5432/postgres
      PUBKY_SWITCH_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch --all-features --locked

  test-harness:
    name: Tests (harness)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: switch
          POSTGRES_PASSWORD: switch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PUBKY_SWITCH_TEST_DATABASE_URL: postgres://switch:switch@localhost:5432/postgres
      PUBKY_SWITCH_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch-harness --all-features --locked

  test-signer:
    name: Tests (signer)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch-signer --all-features --locked

  test-client-core:
    name: Tests (client and core)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p pubky-switch-client -p pubky-switch-core --all-features --locked

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: MSRV (1.91.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --all-features --locked

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t pubky-switch:ci .
      - name: Smoke test
        run: |
          docker run --rm pubky-switch:ci check-config
          docker network create switch
          docker run -d --name db --network switch \
            -e POSTGRES_USER=switch -e POSTGRES_PASSWORD=switch postgres:17
          # Over TCP, as the service connects: while it initializes, the image's server
          # answers on its Unix socket only, then restarts.
          for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U switch && break; sleep 1; done
          docker run -d --name switch --network switch -p 127.0.0.1:9090:9090 \
            -e PUBKY_SWITCH_DATABASE_URL=postgres://switch:switch@db:5432/switch \
            pubky-switch:ci
          for i in $(seq 1 30); do curl -sf localhost:9090/health/ready && break; sleep 1; done
          curl -sf localhost:9090/health/ready
          docker stop switch
      - name: Service logs
        if: failure()
        run: |
          docker ps -a
          docker logs switch || true
          docker logs db 2>&1 | tail -50 || true
