[package]
name = "pubky-switch-harness"
description = "Test harness: client and signer flows against the Pubky Switch service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Test-only: this crate turns on the service's `test-util` and the client's `test-support`.
# No production crate depends on it, and the service's image is built with `-p pubky-switch`.
[dependencies]
axum.workspace = true
pubky-switch = { workspace = true, features = ["test-util"] }
pubky-switch-client = { workspace = true, features = ["test-support"] }
pubky-switch-core.workspace = true
pubky-switch-signer.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tower.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
