[package]
name = "pubky-switch"
description = "Inbox and coordination service for Pubky identities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pubky-switch"
path = "src/main.rs"

[features]
# Test helpers, such as a clock that moves only when told to. Never enabled in a production
# build; the crate's own tests turn it on through the dev-dependency below.
test-util = []

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
ipnet.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
parking_lot.workspace = true
pubky-switch-core.workspace = true
roughenough-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
pubky-switch = { path = ".", features = ["test-util"] }
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
