[workspace]
resolver = "3"
members = ["crates/pubky-switch", "crates/pubky-switch-paykit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/pubky/pubky-switch"
publish = false

[workspace.dependencies]
pubky-switch = { path = "crates/pubky-switch" }
pubky-switch-paykit = { path = "crates/pubky-switch-paykit" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
# No panics on network input: fallible paths return errors. `clippy.toml` allows these in tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
