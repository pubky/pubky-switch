[workspace]
resolver = "3"
members = [
    "crates/pubky-switch-core",
    "crates/pubky-switch-client",
    "crates/pubky-switch-signer",
    "crates/pubky-switch",
    "crates/pubky-switch-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/pubky/pubky-switch"
publish = false

[workspace.dependencies]
pubky-switch-core = { path = "crates/pubky-switch-core" }
pubky-switch-client = { path = "crates/pubky-switch-client" }
pubky-switch-signer = { path = "crates/pubky-switch-signer" }
pubky-switch = { path = "crates/pubky-switch" }

axum = "0.8"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
curve25519-dalek = "5"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "chacha", "x25519"] }
ipnet = { version = "2", features = ["serde"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
parking_lot = "0.12"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
roughenough-protocol = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tempfile = "3"
thiserror = "2"
# Each crate names the features it uses, so that the client's default build stays lean.
tokio = { version = "1", default-features = false }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
# No panics on network input: fallible paths return errors. `clippy.toml` allows these in tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
